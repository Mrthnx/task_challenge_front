<app-navbar />

<div class="min-h-screen bg-base-200">
  <div class="container mx-auto p-4 lg:p-8">
    <!-- Header Section -->
    <div class="mb-8 animate-fade-in">
      <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
        <div>
          <h1 class="text-4xl font-bold text-base-content mb-2">
            <i class="fa-solid fa-clipboard-check text-primary mr-3"></i>
            Mis Tareas
          </h1>
          <p class="text-base-content/70">
            Organiza y gestiona todas tus actividades
          </p>
        </div>
      </div>
    </div>

    <!-- Stats Cards -->
    <div class="stats stats-vertical lg:stats-horizontal shadow-lg w-full mb-8 animate-slide-up bg-base-100">
      <div class="stat">
        <div class="stat-figure text-primary">
          <i class="fa-solid fa-list-check text-4xl"></i>
        </div>
        <div class="stat-title">Total de Tareas</div>
        <div class="stat-value text-primary">{{ taskStore.allTasks().length }}</div>
        <div class="stat-desc">Todas las tareas registradas</div>
      </div>

      <div class="stat">
        <div class="stat-figure text-warning">
          <i class="fa-solid fa-clock text-4xl"></i>
        </div>
        <div class="stat-title">Pendientes</div>
        <div class="stat-value text-warning">{{ getPendingTasksCount() }}</div>
        <div class="stat-desc">Tareas por completar</div>
      </div>

      <div class="stat">
        <div class="stat-figure text-success">
          <i class="fa-solid fa-circle-check text-4xl"></i>
        </div>
        <div class="stat-title">Completadas</div>
        <div class="stat-value text-success">{{ getCompletedTasksCount() }}</div>
        <div class="stat-desc">Tareas finalizadas</div>
      </div>
    </div>

    <!-- Tasks List Component -->
    <app-tasks-list />
  </div>
</div>
