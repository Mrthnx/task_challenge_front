<dialog class="modal modal-bottom sm:modal-middle modal-open">
  <div class="modal-box">
    <div class="flex items-start gap-4 mb-6">
      <div class="rounded-full bg-info/10 p-3">
        <i class="fa-solid fa-edit text-3xl text-info"></i>
      </div>
      <div class="flex-1">
        <h3 class="text-2xl font-bold">Editar Tarea</h3>
        <p class="text-sm text-base-content/60 mt-1">Modifica los campos que necesites</p>
      </div>
      <button
        type="button"
        (click)="removeTask()"
        class="btn btn-error btn-sm btn-circle"
        title="Eliminar tarea"
      >
        <i class="fa-solid fa-trash"></i>
      </button>
    </div>

    <form [formGroup]="taskForm" (ngSubmit)="handleUpdate()">
      <div class="space-y-4">
        <div class="form-control">
          <label class="label">
            <span class="label-text font-semibold">
              <i class="fa-solid fa-heading text-info mr-2"></i>
              Título
            </span>
          </label>
          <input
            formControlName="title"
            type="text"
            placeholder="Título de la tarea"
            class="input input-bordered w-full focus:input-info"
          />
          @if (taskForm.get('title')?.invalid && taskForm.get('title')?.touched) {
            <label class="label">
              <span class="label-text-alt text-error">
                <i class="fa-solid fa-circle-exclamation mr-1"></i>
                El título es requerido
              </span>
            </label>
          }
        </div>

        <div class="form-control">
          <label class="label">
            <span class="label-text font-semibold">
              <i class="fa-solid fa-align-left text-info mr-2"></i>
              Descripción
            </span>
          </label>
          <textarea
            formControlName="description"
            placeholder="Descripción de la tarea"
            class="textarea textarea-bordered w-full h-24 focus:textarea-info"
          ></textarea>
        </div>

        <div class="alert alert-info">
          <i class="fa-solid fa-clock"></i>
          <div class="flex flex-col text-sm">
            <span class="font-semibold">Última actualización</span>
            <span>
              {{ task()?.updateDate ?? task()?.createDate | date: "dd/MM/yyyy 'a las' HH:mm" }}
            </span>
          </div>
        </div>
      </div>

      <div class="modal-action">
        <button type="button" class="btn btn-ghost" (click)="handleCancel()">
          <i class="fa-solid fa-times"></i>
          Cancelar
        </button>
        <button
          class="btn btn-info"
          type="submit"
          [disabled]="taskForm.invalid"
        >
          <i class="fa-solid fa-save"></i>
          Guardar Cambios
        </button>
      </div>
    </form>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button (click)="handleCancel()">close</button>
  </form>
</dialog>
