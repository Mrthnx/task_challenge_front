<dialog class="modal modal-bottom sm:modal-middle modal-open">
  <div class="modal-box">
    <div class="flex flex-col items-center text-center">
      <div class="rounded-full bg-error/10 p-6 mb-4">
        <i class="fa-solid fa-trash-can text-6xl text-error"></i>
      </div>
      
      <h3 class="text-2xl font-bold mb-2">¿Eliminar Tarea?</h3>
      <p class="text-base-content/70 mb-6">
        Esta acción no se puede deshacer. La tarea será eliminada permanentemente.
      </p>

      <div class="alert alert-warning mb-6">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span class="text-sm">Esta acción es irreversible</span>
      </div>
    </div>

    <div class="modal-action justify-center gap-3">
      <button class="btn btn-ghost gap-2" (click)="handleCancel()">
        <i class="fa-solid fa-times"></i>
        No, Cancelar
      </button>
      <button class="btn btn-error gap-2" (click)="handleConfirm()">
        <i class="fa-solid fa-trash"></i>
        Sí, Eliminar
      </button>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button (click)="handleCancel()">close</button>
  </form>
</dialog>
