<div class="navbar bg-base-100 shadow-lg sticky top-0 z-50 backdrop-blur-sm bg-base-100/95">
  <div class="navbar-start">
    <div class="dropdown">
      <div tabindex="0" role="button" class="btn btn-ghost lg:hidden">
        <i class="fa-solid fa-bars text-xl"></i>
      </div>
      <ul tabindex="0" class="menu menu-sm dropdown-content bg-base-100 rounded-box z-[1] mt-3 w-52 p-2 shadow-xl border border-base-300">
        <li>
          <div class="form-control">
            <label class="input input-bordered input-sm flex items-center gap-2">
              <input
                type="text"
                class="grow"
                placeholder="Buscar..."
                [formControl]="searchControl"
              />
              <i class="fa-solid fa-search text-base-content/50"></i>
            </label>
          </div>
        </li>
      </ul>
    </div>
    <a class="btn btn-ghost normal-case text-xl gap-2">
      <i class="fa-solid fa-list-check text-primary"></i>
      <span class="font-bold">Task Challenge</span>
    </a>
  </div>
  
  <div class="navbar-center hidden lg:flex">
    <label class="input input-bordered flex items-center gap-2 rounded-full w-80 focus-within:input-primary">
      <i class="fa-solid fa-search text-base-content/50"></i>
      <input
        type="text"
        class="grow"
        placeholder="Buscar tareas..."
        [formControl]="searchControl"
      />
      @if (searchControl.value) {
        <button class="btn btn-ghost btn-xs btn-circle" (click)="clearSearch()">
          <i class="fa-solid fa-times"></i>
        </button>
      }
    </label>
  </div>
  
  <div class="navbar-end gap-2">
    <!-- User Menu -->
    @if (authService.userInfo()) {
      <div class="dropdown dropdown-end">
        <div tabindex="0" role="button" class="btn btn-ghost gap-2">
          <div class="avatar placeholder">
            <div class="bg-primary text-primary-content w-10 rounded-full">
              <span class="text-sm font-bold">
                {{ authService.userInfo()?.email!.charAt(0).toUpperCase() }}
              </span>
            </div>
          </div>
          <span class="hidden md:inline font-semibold">
            {{ authService.userInfo()?.email!.split("@")[0] }}
          </span>
        </div>
        <ul tabindex="0" class="dropdown-content menu bg-base-100 rounded-box z-[1] w-52 p-2 shadow-xl border border-base-300 mt-4">
          <li class="menu-title">
            <span class="flex items-center gap-2 truncate">
              <i class="fa-solid fa-envelope text-xs"></i>
              <span class="truncate text-xs">{{ authService.userInfo()?.email }}</span>
            </span>
          </li>
          <div class="divider my-1"></div>
          <li>
            <a (click)="handleLogout()" class="text-error">
              <i class="fa-solid fa-right-from-bracket"></i>
              Cerrar sesión
            </a>
          </li>
        </ul>
      </div>
    }
  </div>
</div>
